<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>抽屉原则及其他-初等数学-得鹿梦鱼</title>  <link rel="shortcut icon" href="/assets/images/favicon.ico">    <meta name="Author" content="liming_longxi@163.com">    <meta name="Keywords" content="抽屉原则及其他"/>  <link rel="stylesheet" href="/assets/styles/main.css" />  <link rel="stylesheet" href="/assets/styles/katex/common.css" />  <link rel="stylesheet" href="/assets/styles/katex/katex.min.css" />  <script src="/assets/script/highlight.js"></script></head><body data-for="html-export">  <div class="w-screen h-screen flex flex-col overflow-hidden">    <header class="flex flex-grow-0 justify-between p-4 border-b border-neutral-200">      <a href="/" class="flex items-center text-2xl text-neutral-700 cursor-pointer">        <img src="/assets/images/logo.svg" class="w-[40px] h-[40px]" alt="得鹿梦鱼"></Image>        <span class="text-4 ml-4">得鹿梦鱼</span>      </a>      <div class="right flex items-center cursor-pointer">        <a href="/classify.html" class="mr-2 text-md hover:text-sky-500">知识库</a>        <a href="/frontend.html" class="mr-2 text-md hover:text-sky-500">前端技能树</a>        <a href="/question.html" class="mr-2 text-md hover:text-sky-500">面试题</a>        <a href="/study.html" class="mr-2 text-md hover:text-sky-500">学习资料</a>        <a href="/about.html" class="mr-2 text-md hover:text-sky-500">关于本人</a>      </div>    </header>    <main class="flex-grow-1 overflow-hidden scrollHeight">      <div class="w-screen flex flex-1">        <aside class="basis-2/12 border-r border-gray-300 h-full overflow-hidden">          <div class="text-md font-bold text-gray-700 m-4">初等数学</div>          <div class="overflow-x-hidden overflow-y-auto scrollChapterHeight scrollbar flex flex-col">            <a class="text-md block mx-4 mb-2 cursor-pointer overflow-hidden text-ellipsis whitespace-nowrap hover:text-sky-300" href="/788adf0fc9fd8a73248fa58e1bdc8ebe_1.html" title="抽屉原则及其他">抽屉原则及其他            </a>          </div>        </aside>        <section class="basis-10/12 overflow-x-hidden overflow-y-auto scrollChapterHeight scrollbar">          <div id="markdown-container" class="px-4 relative">                          <div class="crossnote markdown-preview  ">      <h1 id="抽屉原则及其他">抽屉原则及其他 </h1><ul><li>把多余n个的元素按任一确定的分时分成n个集合，那么一定有一个集合中包含有两个或者两个以上的元素</li><li>把多余 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mo>×</mo><mi>n</mi></mrow><annotation encoding="application/x-tex">m \times n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span>个的元素按任一确定的分时分成n个集合，那么一定有一个集合中包含有<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mo>+</mo><mn>1</mn><mtext>个</mtext></mrow><annotation encoding="application/x-tex">m+1个</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">1</span><span class="mord cjk_fallback">个</span></span></span></span>或者<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">m+1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span>个以上的元素</li><li>把无穷个元素按任一确定的方式分成有穷多个元素，那么至少有一个集合中仍含有无穷多个元素</li></ul><p>以上三个原则都被称为<strong>抽屉原则</strong></p>      </div>      <div class="md-sidebar-toc"><div class="md-toc"><div class="md-toc-link-wrapper" style="padding:0;;display:list-item;list-style:square;margin-left:18px">          <a href="#抽屉原则及其他" class="md-toc-link">            <p>抽屉原则及其他</p>          </a></div></div></div>      <a id="sidebar-toc-btn">≡</a>                        <script>var sidebarTOCBtn = document.getElementById'sidebar-toc-btn'sidebarTOCBtn.addEventListener'click', functionevent {  event.stopPropagation  if document.body.hasAttribute'html-show-sidebar-toc' {    document.body.removeAttribute'html-show-sidebar-toc'  } else {    document.body.setAttribute'html-show-sidebar-toc', true  }}</script>                      </div>        </section>      </div>    </main></body></html>
